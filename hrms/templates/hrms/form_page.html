{% extends "base.html" %}
{% load ui %}

{% block title %}{{ page_header.title }} — HRMS{% endblock %}

{% block content %}
{% ui_page_header page_header %}
{% if extra_note %}<p class="meta">{{ extra_note }}</p>{% endif %}
<section class="panel">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% ui_form form=form submit_label="Save" %}
  </form>
</section>
{% endblock %}
